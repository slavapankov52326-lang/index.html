/* ================== УТИЛИТЫ ================== */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function hashPassword(password, salt) {
  const enc = new TextEncoder();
  const data = enc.encode(salt + ':' + password);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function safeJSON(str, fallback) {
  try { return JSON.parse(str); } catch { return fallback; }
}

/* ================== ЗВУК ================== */
let sharedAudioCtx = null;
function ensureAudio() {
  if (sharedAudioCtx) {
    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(()=>{});
    return sharedAudioCtx;
  }
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    sharedAudioCtx = new Ctor();
    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(()=>{});
  } catch (e) { sharedAudioCtx = null; }
  return sharedAudioCtx;
}
document.addEventListener('click', function onceClick(){ ensureAudio(); document.removeEventListener('click', onceClick); });
document.addEventListener('touchstart', function onceTouch(){ ensureAudio(); document.removeEventListener('touchstart', onceTouch); });

function playSound() {
  if (!soundEnabled) return;
  const ctx = ensureAudio(); if (!ctx) return;
  try {
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.1);
  } catch (e) {}
}
function playBell() {
  if (!soundEnabled) return;
  if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
  const ctx = ensureAudio(); if (!ctx) return;
  try {
    [880, 1320].forEach((freq, i) => {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i * 0.08 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.6);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.08);
      osc.stop(ctx.currentTime + i * 0.08 + 0.65);
    });
  } catch (e) {}
}

/* ================== TOAST ================== */
function showToast(message, type = 'info') {
  let container = document.querySelector('.toast-container');
  if (!container) {
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
  toast.innerHTML = `<span>${icon}</span> <span>${esc(message)}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 300); }, 2500);
}
window.alert = function(msg) { showToast(msg, 'info'); };

/* ================== КАРТА ================== */
function openMapModal() {
  document.getElementById('mapModal').classList.remove('h');
  setTimeout(() => {
    if (!modalMap) {
      modalMap = L.map('modalMap', {center: [coords.lat, coords.lng], zoom: 15, attributionControl: false});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMap);
      modalMarker = L.marker([coords.lat, coords.lng], {draggable: true}).addTo(modalMap);
      modalMarker.on('dragend', function() {
        const ll = modalMarker.getLatLng();
        coords = { lat: ll.lat, lng: ll.lng };
        reverseGeocode(ll.lat, ll.lng, 'modalAddr');
      });
      modalMap.on('click', function(e) {
        coords = { lat: e.latlng.lat, lng: e.latlng.lng };
        modalMarker.setLatLng([coords.lat, coords.lng]);
        reverseGeocode(coords.lat, coords.lng, 'modalAddr');
      });
    } else {
      modalMap.setView([coords.lat, coords.lng], 15);
      modalMarker.setLatLng([coords.lat, coords.lng]);
    }
    reverseGeocode(coords.lat, coords.lng, 'modalAddr');
    setTimeout(() => modalMap.invalidateSize(), 200);
  }, 100);
}
function closeMapModal() { document.getElementById('mapModal').classList.add('h'); }
function confirmMapAddress() {
  const val = document.getElementById('modalAddr').value.trim();
  if (!val || val === 'Адрес не найден' || val === 'Ошибка определения' || val === 'Определяем адрес...') {
    showToast('Подождите, пока определится адрес', 'warning');
    return;
  }
  document.getElementById('addr').value = val;
  closeMapModal();
  showToast('✅ Адрес выбран', 'success');
}
function reverseGeocode(lat, lng, targetId) {
  const el = document.getElementById(targetId);
  el.value = 'Определяем адрес...';
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ru`)
    .then(res => res.json())
    .then(data => {
      el.value = (data && data.display_name)
        ? data.display_name.split(', ').slice(0, 4).join(', ')
        : 'Адрес не найден';
    })
    .catch(() => { el.value = 'Ошибка определения'; });
}
function manualAddressInput(value) {
  clearTimeout(addrTimer);
  if (value.length < 3) return;
  addrTimer = setTimeout(() => {
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(value)}&limit=1&accept-language=ru`)
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        }
      }).catch(() => {});
  }, 800);
}
function toggleMapVisibility(checkbox) {
  if (checkbox.checked) {
    if (navigator.geolocation) {
      if (window.masterWatchId) navigator.geolocation.clearWatch(window.masterWatchId);
      window.masterWatchId = navigator.geolocation.watchPosition(
        (position) => {
          localStorage.setItem('master_visible', 'true');
          localStorage.setItem('master_lat', position.coords.latitude);
          localStorage.setItem('master_lng', position.coords.longitude);
        },
        () => showToast('Не удалось получить геолокацию.', 'error'),
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
      );
      showToast('✅ Теперь заказчики видят вас на карте!', 'success');
    } else {
      showToast('Геолокация не поддерживается', 'error');
      checkbox.checked = false;
    }
  } else {
    if (window.masterWatchId) { navigator.geolocation.clearWatch(window.masterWatchId); window.masterWatchId = null; }
    localStorage.removeItem('master_visible');
    localStorage.removeItem('master_lat');
    localStorage.removeItem('master_lng');
    showToast('❌ Вы больше не видны на карте.', 'info');
  }
}

function updateTimeGreeting() {
  const now = new Date();
  const hours = now.getHours();
  const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  let greeting = 'Добрый день!';
  if (hours >= 5 && hours < 12) greeting = 'Доброе утро!';
  else if (hours >= 12 && hours < 18) greeting = 'Добрый день!';
  else if (hours >= 18 && hours < 23) greeting = 'Добрый вечер!';
  else greeting = 'Доброй ночи!';
  const elG = document.getElementById('greetingText');
  const elD = document.getElementById('currentDate');
  const elT = document.getElementById('currentTime');
  if (elG) elG.textContent = greeting;
  if (elD) elD.textContent = dateStr;
  if (elT) elT.textContent = timeStr;
}

/* ================== ФОТО ================== */
function choosePhotoSource(type) {
  document.getElementById('photoSourceModal').classList.add('h');
  if (type === 'camera') document.getElementById('phCamera').click();
  else document.getElementById('phGallery').click();
}
async function handlePhotos(event) {
  const files = event.target.files;
  const previewBox = document.getElementById('photoPreview');
  if (files && files.length > 0) {
    for (const file of Array.from(files)) {
      let dataUrl;
      try {
        dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      } catch { continue; }
      currentOrderPhotos.push(dataUrl);
    }
    renderPhotoPreviews();
    showToast(`📸 Фото прикреплено: ${files.length}`, 'success');
  }
  event.target.value = '';
}
function renderPhotoPreviews() {
  const box = document.getElementById('photoPreview');
  box.innerHTML = '';
  currentOrderPhotos.forEach((src, idx) => {
    const item = document.createElement('div');
    item.className = 'preview-item';
    const img = document.createElement('img');
    img.src = src;
    img.addEventListener('click', () => openPhotoViewer(src));
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'remove-photo';
    btn.textContent = '×';
    btn.addEventListener('click', (ev) => { ev.stopPropagation(); removePhoto(idx); });
    item.appendChild(img); item.appendChild(btn);
    box.appendChild(item);
  });
}
function removePhoto(index) {
  currentOrderPhotos.splice(index, 1);
  renderPhotoPreviews();
  showToast('Фото удалено', 'info');
}
function openPhotoViewer(src) {
  document.getElementById('photoViewerImg').src = src;
  document.getElementById('photoViewerModal').classList.remove('h');
}

/* ================== АВАТАР ПРИ РЕГИСТРАЦИИ ================== */
function handleAuthAvatar(event) {
  const role = document.getElementById('authRole').value;
  if (role === 'executor') {
    event.target.value = '';
    showToast('Мастерам нельзя загружать фото из галереи. Используйте селфи.', 'warning');
    return;
  }
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    currentAuthAvatar = e.target.result;
    const preview = document.getElementById('authAvatarPreview');
    preview.style.backgroundImage = `url(${currentAuthAvatar})`;
    preview.innerHTML = '';
    preview.style.color = 'transparent';
    playSound();
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

/* ================== СОЗДАНИЕ ЗАКАЗА ================== */
function createOrder() {
  try {
    const user = safeJSON(localStorage.getItem('pg_user'), null);
    if (!user) { showToast('Войдите в аккаунт', 'warning'); return; }
    if (user.role === 'executor') { showToast('Мастера не могут создавать заказы.', 'error'); return; }
    if (!selectedService) { showToast('Выберите услугу', 'error'); return; }

    const addrInput = document.getElementById('addr');
    const addr = (addrInput.value || '').trim();
    if (!addr) { showToast('Введите адрес', 'error'); addrInput.focus(); return; }
    if (['Определяем адрес...', 'Адрес не найден', 'Ошибка определения'].includes(addr)) {
      showToast('Подождите, пока определится адрес, или введите вручную', 'error');
      addrInput.focus(); return;
    }

    const priceRaw = document.getElementById('pr').value;
    const priceNum = parseInt(priceRaw, 10);
    if (!priceRaw || isNaN(priceNum)) { showToast('Укажите цену числом', 'error'); return; }
    if (priceNum < MIN_PRICE) { showToast(`⚠️ Минимальная цена — ${MIN_PRICE} ₽`, 'warning'); return; }
    if (priceNum > MAX_PRICE) { showToast(`⚠️ Свыше ${MAX_PRICE} ₽ — проверка по паспорту мастера.`, 'warning'); return; }

    const lat = (coords && typeof coords.lat === 'number') ? coords.lat : 55.75;
    const lng = (coords && typeof coords.lng === 'number') ? coords.lng : 37.61;

    const order = {
      id: Date.now(),
      user_id: user.id || 1,
      name: user.name,
      phone: user.phone,
      service: selectedService,
      address: addr,
      price: String(priceNum),
      time: getFinalTime(),
      status: 'new',
      isUrgent: document.getElementById('isUrgent').checked,
      timestamp: Date.now(),
      lat, lng,
      client_avatar: user.avatar || null,
      photos: currentOrderPhotos.slice(),
      responses: []
    };
    const orders = safeJSON(localStorage.getItem('pg_orders'), []);
    orders.unshift(order);
    localStorage.setItem('pg_orders', JSON.stringify(orders));
    showToast(`✅ Заказ создан! Фото: ${order.photos.length}`, 'success');

    // Сброс формы
    addrInput.value = '';
    document.getElementById('pr').value = '';
    document.getElementById('cm').value = '';
    document.getElementById('isUrgent').checked = false;
    document.getElementById('photoPreview').innerHTML = '';
    currentOrderPhotos = [];
    document.querySelectorAll('.service').forEach(s => s.classList.remove('selected'));
    selectedService = null;

    updateResponsesBanner();
    st('my');
  } catch (err) {
    console.error('createOrder error:', err);
    showToast('Ошибка: ' + err.message, 'error');
  }
}

/* ================== ОТКЛИКИ ================== */
function updateResponsesBanner() {
  const banner = document.getElementById('newResponsesBanner');
  if (!banner) return;
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  if (!user || user.role !== 'client') { banner.innerHTML = ''; return; }
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const myNew = orders.filter(o =>
    o.status === 'new' &&
    (o.user_id === (user.id || 1) || o.name === user.name) &&
    o.responses && o.responses.length > 0
  );
  if (myNew.length === 0) { banner.innerHTML = ''; return; }
  const total = myNew.reduce((s, o) => s + o.responses.length, 0);
  const first = myNew[0];
  banner.innerHTML = `<div class="response-banner" onclick="openChooseMasterModal()">
    <div class="response-banner-icon">👥</div>
    <div class="response-banner-text">
      <div class="response-banner-title">${total} ${total === 1 ? 'мастер хочет' : 'мастеров хотят'} взять ваш заказ!</div>
      <div class="response-banner-sub">${esc(first.service)} — ${esc(first.price)} ₽ • нажмите, чтобы выбрать</div>
    </div>
    <div style="font-size:24px;flex-shrink:0">›</div>
  </div>`;
}

function openChooseMasterModal() {
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  if (!user) return;
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const myNew = orders.filter(o =>
    o.status === 'new' &&
    (o.user_id === (user.id || 1) || o.name === user.name) &&
    o.responses && o.responses.length > 0
  );
  if (myNew.length === 0) { showToast('Пока нет откликов', 'info'); return; }
  const container = document.getElementById('chooseMasterList');
  container.innerHTML = '';
  myNew.forEach(order => {
    const head = document.createElement('div');
    head.style.cssText = 'background:var(--primary-50);padding:10px 12px;border-radius:10px;margin:10px 0 8px;font-size:12px;font-weight:800;color:var(--primary);';
    head.textContent = `📋 ${order.service} — ${order.price} ₽`;
    container.appendChild(head);
    order.responses.forEach((resp, idx) => {
      const card = document.createElement('div');
      card.className = 'response-card';
      card.innerHTML = `
        <div class="response-card-avatar" style="background-image:url('${esc(resp.master_avatar || '')}')"></div>
        <div class="response-card-info">
          <div class="response-card-name">${esc(resp.master_name)} ${resp.master_verified ? '✅' : ''}</div>
          <div class="response-card-meta">⭐ ${(Number(resp.master_rating) || 5).toFixed(1)} • Проверен</div>
          <div class="response-card-price">${esc(resp.master_price)} ₽</div>
        </div>
        <div><button class="btn btn-g btn-sm" style="padding:10px 14px">Выбрать</button></div>
      `;
      card.querySelector('button').addEventListener('click', () => chooseMaster(order.id, idx));
      container.appendChild(card);
    });
  });
  document.getElementById('chooseMasterModal').classList.remove('h');
}

function chooseMaster(orderId, responseIndex) {
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const idx = orders.findIndex(o => o.id === orderId);
  if (idx === -1) return;
  const order = orders[idx];
  const resp = (order.responses || [])[responseIndex];
  if (!resp) { showToast('Отклик не найден', 'error'); return; }
  showConfirm('Выбрать мастера?', `${resp.master_name} возьмёт ваш заказ «${order.service}».`, () => {
    orders[idx].status = 'in_progress';
    orders[idx].master_name = resp.master_name;
    orders[idx].master_avatar = resp.master_avatar;
    orders[idx].master_phone = resp.master_phone;
    orders[idx].master_verified = resp.master_verified;
    orders[idx].master_rating = resp.master_rating;
    orders[idx].price = resp.master_price;
    orders[idx].selected_at = Date.now();
    if (resp.master_lat && resp.master_lng) {
      orders[idx].master_lat = resp.master_lat;
      orders[idx].master_lng = resp.master_lng;
    }
    localStorage.setItem('pg_orders', JSON.stringify(orders));
    document.getElementById('chooseMasterModal').classList.add('h');
    updateResponsesBanner();
    renderOrders();
    showToast(`✅ Вы выбрали ${resp.master_name}!`, 'success');
  });
}

/* ================== ПРОГРЕСС И СТАТУСЫ ================== */
function renderProgress(status) {
  const steps = [
    { key: 'new', label: 'Опубликован' },
    { key: 'waiting', label: 'Отклики' },
    { key: 'in_progress', label: 'В работе' },
    { key: 'done', label: 'Готово' }
  ];
  let currentIdx = 0;
  if (status === 'new') currentIdx = 1;
  else if (status === 'in_progress') currentIdx = 2;
  else if (status === 'done') currentIdx = 3;
  else if (status === 'cancelled') currentIdx = -1;

  if (status === 'cancelled') {
    return `<div style="text-align:center;padding:8px;background:#FEE2E2;color:#991B1B;border-radius:8px;font-size:11px;font-weight:700;margin-top:6px">❌ Заказ отменён</div>`;
  }
  const pct = currentIdx <= 0 ? 0 : (currentIdx / (steps.length - 1)) * 100;
  return `<div class="order-progress">
    <div class="op-bar"><div class="op-fill" style="width:${pct}%"></div></div>
    <div class="op-labels">${steps.map((s,i)=>`<div class="op-label ${i<=currentIdx?'active':''}">${s.label}</div>`).join('')}</div>
  </div>`;
}
function getStatusText(status) {
  const m = { 'new': 'Ждёт откликов', 'in_progress': 'В работе', 'cancelled': 'Отменен', 'done': 'Выполнен' };
  return m[status] || 'Ждёт откликов';
}

/* ================== СПИСОК ЗАКАЗОВ ================== */
function renderOrders() {
  const box = document.getElementById('list');
  const allOrders = safeJSON(localStorage.getItem('pg_orders'), []);
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  let orders;
  if (user && user.role === 'executor') {
    if (currentOrderTab === 'active') {
      orders = allOrders.filter(o =>
        (o.status === 'new' && !(o.responses || []).some(r => r.master_name === user.name)) ||
        (o.status === 'in_progress' && o.master_name === user.name)
      );
    } else {
      orders = allOrders.filter(o => (o.status === 'done' || o.status === 'cancelled') && o.master_name === user.name);
    }
  } else {
    orders = allOrders.filter(o => {
      if (currentOrderTab === 'active') return o.status === 'new' || o.status === 'in_progress';
      return o.status === 'done' || o.status === 'cancelled';
    });
  }
  if (!orders.length) {
    box.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px">📭 Заказов пока нет</div>';
    return;
  }
  box.innerHTML = orders.map(o => {
    const ratingDisplay = o.rating ? `<span style="color:var(--accent);margin-left:5px">★ ${o.rating}</span>` : '';
    let paymentBadge = '';
    if (o.payment_status === 'paid') {
      const method = o.payment_method === 'cash' ? '💵 Наличные' : '💳 Безнал';
      paymentBadge = `<span style="font-size:10px;background:#D1FAE5;color:#065F46;padding:2px 8px;border-radius:10px;margin-left:5px;font-weight:800">✅ ${method}</span>`;
    }
    let masterInfo = '';
    if (o.master_name && o.master_avatar) {
      masterInfo = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--text-muted)"><div style="width:28px;height:28px;border-radius:50%;background-image:url(${esc(o.master_avatar)});background-size:cover;background-position:center;border:2px solid var(--success);flex-shrink:0"></div><div><b style="color:var(--text)">${esc(o.master_name)}</b> <span style="background:#D1FAE5;color:#065F46;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:800;margin-left:3px">✅ Проверен</span></div></div>`;
    } else if (o.master_name) {
      masterInfo = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Мастер: ${esc(o.master_name)}</div>`;
    } else if (user && user.role === 'executor' && o.client_avatar) {
      masterInfo = `<div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:12px;color:var(--text-muted)"><div style="width:22px;height:22px;border-radius:50%;background-image:url(${esc(o.client_avatar)});background-size:cover;background-position:center;border:1px solid var(--border)"></div> Заказчик: ${esc(o.name)}</div>`;
    } else if (user && user.role === 'executor') {
      masterInfo = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Заказчик: ${esc(o.name)}</div>`;
    }
    let photosBlock = '';
    if (o.photos && o.photos.length > 0) {
      const imgs = o.photos.map((src, pi) =>
        `<img src="${src}" data-photo="${pi}" data-order="${o.id}" class="order-photo-thumb" style="width:72px;height:72px;object-fit:cover;border-radius:var(--r-sm);border:2px solid var(--primary);cursor:pointer">`
      ).join('');
      photosBlock = `<div style="margin-top:10px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:700">📸 Фото (${o.photos.length}):</div><div style="display:flex;gap:6px;flex-wrap:wrap">${imgs}</div></div>`;
    }
    let responsesBlock = '';
    if (o.responses && o.responses.length > 0 && o.status === 'new') {
      responsesBlock = `<div style="margin-top:10px;background:var(--accent-soft);border:2px solid #FCD34D;border-radius:var(--r-sm);padding:10px"><div style="font-size:12px;color:#92400E;font-weight:800">👥 ${o.responses.length} ${o.responses.length === 1 ? 'мастер хочет' : 'мастеров хотят'} взять заказ</div></div>`;
    }
    let actions = '';
    if (user && user.role === 'executor') {
      if (o.status === 'new' && !(o.responses || []).some(r => r.master_name === user.name)) {
        actions = `<button class="btn btn-g btn-sm" onclick="event.stopPropagation(); respondToOrder(${o.id})">🤝 Откликнуться</button><button class="btn btn-warning btn-sm" onclick="event.stopPropagation(); refuseOrder(${o.id})">❌ Пропустить</button>`;
      } else if (o.status === 'new') {
        actions = `<span class="st st-new">✅ Отклик отправлен</span>`;
      } else if (o.status === 'in_progress' && o.master_name === user.name) {
        actions = `<span class="st st-in_progress">Вы приняли</span><button class="btn btn-sm" onclick="event.stopPropagation(); openChat(${o.id})" style="background:#8B5CF6">💬 Чат</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); cancelByMaster(${o.id})">❌ Отказаться</button>`;
      }
    } else if (user && user.role === 'client') {
      if (o.status === 'new') {
        actions = `<button class="btn btn-warning btn-sm" onclick="event.stopPropagation(); cancelOrder(${o.id})">↩️ Отменить</button>`;
      } else if (o.status === 'in_progress') {
        actions = `<button class="btn btn-sm" onclick="event.stopPropagation(); openRatingModal(${o.id})" style="background:var(--info)">🏁 Завершить</button><button class="btn btn-sm" onclick="event.stopPropagation(); openChat(${o.id})" style="background:#8B5CF6">💬 Чат</button>`;
      } else if (o.status === 'done') {
        if (o.payment_status !== 'paid') {
          actions = `<button class="btn btn-g btn-sm" onclick="event.stopPropagation(); openPaymentModal(${o.id})">💳 Оплатить</button>`;
        } else {
          actions = `<span class="st st-done">✅ Оплачено</span>`;
        }
        actions += `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteOrder(${o.id})">🗑 Удалить</button>`;
      } else if (o.status === 'cancelled') {
        actions = `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteOrder(${o.id})">🗑 Удалить</button>`;
      }
    }
    return `<div class="oi" onclick="openOrderMap(${o.id})">
      ${masterInfo}
      <h4>${o.isUrgent ? '<span style="color:var(--danger);font-weight:900">⚡ СРОЧНО </span>' : ''}${esc(o.service)} — ${esc(o.price)} ₽ ${ratingDisplay} ${paymentBadge}</h4>
      <p>📍 ${esc(o.address)}</p>
      <p>⏰ ${esc(o.time)}</p>
      ${photosBlock}
      ${responsesBlock}
      ${renderProgress(o.status)}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:6px">
        <span class="st st-${o.status || 'new'}">${getStatusText(o.status)}</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${actions}</div>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('#list .order-photo-thumb').forEach(img => {
    img.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const orderId = parseInt(img.dataset.order, 10);
      const photoIndex = parseInt(img.dataset.photo, 10);
      const orders2 = safeJSON(localStorage.getItem('pg_orders'), []);
      const ord = orders2.find(o => o.id === orderId);
      if (ord && ord.photos && ord.photos[photoIndex]) openPhotoViewer(ord.photos[photoIndex]);
    });
  });
}

function cancelOrder(id) {
  showConfirm('Отмена', 'Отменить этот заказ?', () => {
    const orders = safeJSON(localStorage.getItem('pg_orders'), []);
    const i = orders.findIndex(o => o.id === id);
    if (i !== -1) {
      orders[i].status = 'cancelled';
      localStorage.setItem('pg_orders', JSON.stringify(orders));
      renderOrders();
      updateResponsesBanner();
    }
  });
}
function deleteOrder(id) {
  showConfirm('Удаление', 'Удалить заказ навсегда?', () => {
    let orders = safeJSON(localStorage.getItem('pg_orders'), []);
    orders = orders.filter(o => o.id !== id);
    localStorage.setItem('pg_orders', JSON.stringify(orders));
    renderOrders();
    updateResponsesBanner();
  });
}

/* ================== ОТКЛИК МАСТЕРА ================== */
function respondToOrder(id) {
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  if (!user || user.role !== 'executor') return;
  showConfirm('Откликнуться на заказ?', 'Заказчик увидит ваш отклик и сможет выбрать вас.', () => {
    const orders = safeJSON(localStorage.getItem('pg_orders'), []);
    const idx = orders.findIndex(o => o.id === id);
    if (idx === -1) return;
    if (!orders[idx].responses) orders[idx].responses = [];
    if (orders[idx].responses.some(r => r.master_name === user.name && r.master_phone === user.phone)) {
      showToast('Вы уже откликнулись', 'info');
      return;
    }
    const finish = (lat, lng) => addResponse(orders, idx, user, lat, lng);
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => finish(pos.coords.latitude, pos.coords.longitude),
        () => finish(orders[idx].lat || 55.75, orders[idx].lng || 37.61)
      );
    } else {
      finish(orders[idx].lat || 55.75, orders[idx].lng || 37.61);
    }
  });
}
function addResponse(orders, idx, user, lat, lng) {
  orders[idx].responses.push({
    master_name: user.name,
    master_avatar: user.avatar || null,
    master_rating: 5.0,
    master_price: orders[idx].price,
    master_phone: user.phone,
    master_verified: true,
    master_lat: lat,
    master_lng: lng,
    timestamp: Date.now()
  });
  localStorage.setItem('pg_orders', JSON.stringify(orders));
  renderOrders();
  showToast('✅ Отклик отправлен! Ждите ответа заказчика.', 'success');
}
function refuseOrder(id) {
  showConfirm('Пропустить?', 'Вы уверены, что хотите пропустить этот заказ?', () => {
    showToast('Заказ пропущен', 'info');
  });
}
function cancelByMaster(id) {
  showConfirm('Отказаться от заказа?', 'Заказ вернется в общий список.', () => {
    showPrompt('Причина отказа', 'Например: срочно уехал, заболел...', (reason) => {
      const orders = safeJSON(localStorage.getItem('pg_orders'), []);
      const idx = orders.findIndex(o => o.id === id);
      if (idx !== -1) {
        orders[idx].status = 'new';
        orders[idx].cancel_reason = reason;
        orders[idx].master_name = null;
        orders[idx].master_avatar = null;
        orders[idx].master_phone = null;
        localStorage.setItem('pg_orders', JSON.stringify(orders));
        renderOrders();
        showToast('Вы отказались от заказа', 'info');
      }
    });
  });
}

/* ================== ЧАТ ================== */
function openChat(orderId) {
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const order = orders.find(o => o.id === orderId);
  if (!order) return;
  currentChatOrderId = orderId;
  document.getElementById('chatTitle').textContent = `💬 ${order.service}`;
  loadMessages(orderId);
  document.getElementById('chatModal').classList.remove('h');
}
function loadMessages(orderId) {
  const chatBox = document.getElementById('chatMessages');
  const messages = safeJSON(localStorage.getItem(`chat_${orderId}`), []);
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const order = orders.find(o => o.id === orderId);
  if (!messages.length) {
    chatBox.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:12px;margin-top:20px">Сообщений пока нет.</div>';
    return;
  }
  chatBox.innerHTML = messages.map((m, idx) => {
    const isMe = user && m.sender === user.name;
    const roleText = m.role === 'executor' ? ' (Мастер)' : ' (Заказчик)';
    let avatarUrl = '';
    if (m.role === 'executor' && order && order.master_avatar) avatarUrl = order.master_avatar;
    const avatarHtml = avatarUrl
      ? `<div style="width:24px;height:24px;border-radius:50%;background-image:url(${esc(avatarUrl)});background-size:cover;border:1px solid #fff;margin-right:5px;flex-shrink:0"></div>`
      : '';
    const reportBtn = !isMe
      ? `<button style="background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;padding:2px 6px;opacity:.6" onclick="event.stopPropagation(); reportMessage(${orderId}, ${idx})" title="Пожаловаться">🚩</button>`
      : '';
    return `<div class="chat-bubble ${isMe ? 'chat-me' : 'chat-other'}" style="display:flex;align-items:flex-end;gap:5px;flex-direction:${isMe ? 'row-reverse' : 'row'}">
      ${avatarHtml}
      <div>
        <div style="font-size:10px;font-weight:800;opacity:.8;margin-bottom:3px;color:${isMe ? '#fff' : 'var(--primary)'};text-align:${isMe ? 'right' : 'left'}">${esc(m.sender)}${roleText}</div>
        <div>${esc(m.text)}</div>
        <div class="chat-time">${esc(m.time)} ${reportBtn}</div>
      </div>
    </div>`;
  }).join('');
  chatBox.scrollTop = chatBox.scrollHeight;
}
function reportMessage(orderId, msgIndex) {
  showConfirm('Пожаловаться на сообщение?', 'Жалоба будет отправлена модератору.', () => {
    const reports = safeJSON(localStorage.getItem('pg_reports'), []);
    const messages = safeJSON(localStorage.getItem(`chat_${orderId}`), []);
    const user = safeJSON(localStorage.getItem('pg_user'), null);
    const msg = messages[msgIndex] || {};
    reports.push({
      id: Date.now(),
      order_id: orderId,
      message_index: msgIndex,
      message_text: msg.text || '',
      message_sender: msg.sender || '',
      reporter: user ? user.name : 'аноним',
      timestamp: Date.now()
    });
    localStorage.setItem('pg_reports', JSON.stringify(reports));
    showToast('✅ Жалоба отправлена. Спасибо!', 'success');
  });
}
function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentChatOrderId) return;
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  if (!user) return;
  const messages = safeJSON(localStorage.getItem(`chat_${currentChatOrderId}`), []);
  messages.push({
    sender: user.name,
    role: user.role,
    text,
    time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
  });
  localStorage.setItem(`chat_${currentChatOrderId}`, JSON.stringify(messages));
  input.value = '';
  loadMessages(currentChatOrderId);
  playSound();
}

/* ================== РЕЙТИНГ ================== */
function openRatingModal(orderId) {
  ratingOrderId = orderId;
  currentRating = 0;
  updateStars(0);
  document.getElementById('ratingModal').classList.remove('h');
}
function setRating(val) { currentRating = val; updateStars(val); playSound(); }
function updateStars(val) {
  document.querySelectorAll('#starsContainer span').forEach((star, index) => {
    star.style.color = index < val ? 'var(--accent)' : '#DDD';
  });
}
function submitRating() {
  if (currentRating === 0) { showToast('Поставьте оценку', 'warning'); return; }
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const i = orders.findIndex(o => o.id === ratingOrderId);
  if (i !== -1) {
    orders[i].rating = currentRating;
    orders[i].status = 'done';
    localStorage.setItem('pg_orders', JSON.stringify(orders));
    showToast(`⭐ Спасибо! Вы поставили ${currentRating} звезд.`, 'success');
    document.getElementById('ratingModal').classList.add('h');
    renderOrders();
    updateResponsesBanner();
  }
}

/* ================== ОПЛАТА ================== */
function openPaymentModal(orderId) {
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const order = orders.find(o => o.id === orderId);
  if (!order) return;
  document.getElementById('paymentAmount').textContent = order.price + ' ₽';
  let masterInfo = '';
  if (order.master_name && order.master_phone) {
    masterInfo = `<div style="background:#F0FDF4;border:2px solid var(--success);border-radius:var(--r-md);padding:12px;margin-bottom:15px;text-align:left;display:flex;align-items:center;gap:10px">
      ${order.master_avatar ? `<div style="width:44px;height:44px;border-radius:50%;background-image:url(${esc(order.master_avatar)});background-size:cover;background-position:center;border:2px solid var(--success);flex-shrink:0"></div>` : ''}
      <div>
        <p style="font-size:12px;color:#065F46;margin-bottom:3px;font-weight:800">✅ Проверенный мастер</p>
        <p style="font-size:14px;font-weight:800">${esc(order.master_name)}</p>
        <p style="font-size:13px;color:var(--info);font-weight:700">📞 ${esc(order.master_phone)}</p>
      </div>
    </div>`;
  }
  document.getElementById('paymentMasterInfo').innerHTML = masterInfo;
  selectedPaymentMethod = 'cash';
  document.getElementById('payCashBtn').classList.add('active');
  document.getElementById('payCardBtn').classList.remove('active');
  document.getElementById('paymentModal').classList.remove('h');
  currentOrderId = orderId;
}
function selectPaymentMethod(method) {
  selectedPaymentMethod = method;
  const cashBtn = document.getElementById('payCashBtn');
  const cardBtn = document.getElementById('payCardBtn');
  cashBtn.classList.remove('active');
  cardBtn.classList.remove('active');
  (method === 'cash' ? cashBtn : cardBtn).classList.add('active');
  playSound();
}
function processPayment() {
  if (!currentOrderId) return;
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const i = orders.findIndex(o => o.id === currentOrderId);
  if (i !== -1) {
    orders[i].payment_status = 'paid';
    orders[i].payment_method = selectedPaymentMethod;
    localStorage.setItem('pg_orders', JSON.stringify(orders));
    const methodText = selectedPaymentMethod === 'cash' ? 'наличными' : 'безналично';
    showToast(`✅ Оплата ${methodText} подтверждена!`, 'success');
    document.getElementById('paymentModal').classList.add('h');
    renderOrders();
  }
}

async function login() {
  const name = document.getElementById('authName').value.trim();
  const phone = document.getElementById('authPhone').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  const role = document.getElementById('authRole').value;

  if (!name || !phone) return showToast('Введите имя и телефон', 'error');
  if (!password || password.length < 4) return showToast('Введите пароль (мин 4)', 'error');
  if (role === 'executor' && !isFaceVerified) return showToast('❌ Мастер обязан пройти проверку лица (селфи)!', 'error');
  if (role === 'executor' && !currentAuthAvatar) return showToast('❌ Селфи не сохранилось. Попробуйте ещё раз.', 'error');

  // Хешируем пароль — не храним в открытом виде
  const salt = 'pg_salt_v1';
  let passwordHash = '';
  try {
    passwordHash = await hashPassword(password, salt);
  } catch {
    showToast('Ошибка браузера: не удалось захешировать пароль', 'error');
    return;
  }

  const user = {
    id: Date.now(),
    name, phone, role,
    verified: role === 'executor',
    avatar: currentAuthAvatar,
    password_hash: passwordHash
  };
  localStorage.setItem('pg_user', JSON.stringify(user));
  lastKnownResponsesCount = null;
  lastKnownAvailableIds = [];
  document.getElementById('authModal').classList.add('h');
  showToast('✅ Вы вошли как ' + name, 'success');
  ui();
  st(role === 'executor' ? 'my' : 'new');
}

function checkMasterCabinet() {
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  const masterPanel = document.getElementById('masterPanel');
  const notMasterMsg = document.getElementById('notMasterMessage');
  if (!masterPanel || !notMasterMsg) return;
  if (user && user.role === 'executor') {
    masterPanel.classList.remove('h');
    notMasterMsg.classList.add('h');
    updateMasterStats();
    const av = document.getElementById('masterCabinetAvatar');
    const nm = document.getElementById('masterCabinetName');
    if (av && user.avatar) av.style.backgroundImage = `url(${user.avatar})`;
    if (nm) nm.textContent = user.name;
    if (localStorage.getItem('master_visible') === 'true') {
      const toggle = document.getElementById('showOnMapToggle');
      if (toggle) toggle.checked = true;
    }
  } else {
    masterPanel.classList.add('h');
    notMasterMsg.classList.remove('h');
  }
}

function updateMasterStats() {
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  if (!user || user.role !== 'executor') return;
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const myOrders = orders.filter(o => o.master_name === user.name);
  const doneOrders = myOrders.filter(o => o.status === 'done');
  const totalEarned = doneOrders.reduce((sum, o) => {
    const p = parseInt(String(o.price).replace(/\D/g, ''), 10);
    return sum + (isNaN(p) ? 0 : p);
  }, 0);
  const ratedOrders = doneOrders.filter(o => o.rating);
  const avgRating = ratedOrders.length > 0
    ? (ratedOrders.reduce((sum, o) => sum + o.rating, 0) / ratedOrders.length).toFixed(1)
    : '0.0';
  const responsesCount = orders.filter(o =>
    o.status === 'new' && !(o.responses || []).some(r => r.master_name === user.name)
  ).length;
  document.getElementById('statCompleted').textContent = doneOrders.length;
  document.getElementById('statEarned').textContent = totalEarned.toLocaleString('ru-RU') + ' ₽';
  document.getElementById('statRating').textContent = avgRating;
  document.getElementById('statResponses').textContent = responsesCount;
}

async function startFaceCheck() {
  document.getElementById('faceCheckModal').classList.remove('h');
  try {
    faceStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    document.getElementById('faceVideo').srcObject = faceStream;
  } catch (e) {
    showToast('Нет доступа к камере', 'error');
    document.getElementById('faceCheckModal').classList.add('h');
  }
}
function captureFace() {
  const video = document.getElementById('faceVideo');
  if (!video.videoWidth) { showToast('Камера ещё не готова', 'warning'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 320;
  const ctx = canvas.getContext('2d');
  const size = Math.min(video.videoWidth, video.videoHeight);
  const sx = (video.videoWidth - size) / 2;
  const sy = (video.videoHeight - size) / 2;
  ctx.drawImage(video, sx, sy, size, size, 0, 0, 320, 320);
  const selfieData = canvas.toDataURL('image/jpeg', 0.8);
  currentAuthAvatar = selfieData;
  const preview = document.getElementById('authAvatarPreview');
  preview.style.backgroundImage = `url(${selfieData})`;
  preview.innerHTML = '';
  preview.style.color = 'transparent';
  isFaceVerified = true;
  document.getElementById('faceStatus').textContent = '✅ Проверен (фото сохранено)';
  document.getElementById('faceStatus').style.color = 'var(--success)';
  if (faceStream) faceStream.getTracks().forEach(t => t.stop());
  document.getElementById('faceCheckModal').classList.add('h');
  showToast('✅ Селфи сохранено как фото профиля', 'success');
}
function cancelFaceCheck() {
  if (faceStream) faceStream.getTracks().forEach(t => t.stop());
  document.getElementById('faceCheckModal').classList.add('h');
}

function openOrderMap(orderId) {
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  const order = orders.find(o => o.id === orderId);
  if (!order) return;

  let masterBlock = '';
  if (order.master_name && order.master_avatar) {
    masterBlock = `<div style="display:flex;align-items:center;gap:10px;padding:12px;background:#F0FDF4;border:2px solid var(--success);border-radius:var(--r-md);margin-bottom:12px">
      <div style="width:50px;height:50px;border-radius:50%;background-image:url(${esc(order.master_avatar)});background-size:cover;background-position:center;border:2px solid var(--success);flex-shrink:0"></div>
      <div><div style="font-weight:800">${esc(order.master_name)}</div><div style="font-size:11px;color:#065F46">✅ Проверен • фото с селфи</div></div>
    </div>`;
  }
  let photosBlock = '';
  if (order.photos && order.photos.length > 0) {
    const imgs = order.photos.map((src, pi) =>
      `<img src="${src}" data-photo="${pi}" data-order="${order.id}" class="order-photo-thumb-detail" style="width:80px;height:80px;object-fit:cover;border-radius:var(--r-sm);border:2px solid var(--primary);cursor:pointer">`
    ).join('');
    photosBlock = `<div style="margin:10px 0"><div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:700">📸 Фото (${order.photos.length}):</div><div style="display:flex;gap:6px;flex-wrap:wrap">${imgs}</div></div>`;
  }
  let responsesBlock = '';
  if (order.responses && order.responses.length > 0 && order.status === 'new') {
    const list = order.responses.map(r =>
      `<div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface-2);border-radius:var(--r-sm);margin-bottom:6px">
        ${r.master_avatar ? `<div style="width:32px;height:32px;border-radius:50%;background-image:url(${esc(r.master_avatar)});background-size:cover;border:2px solid var(--success);flex-shrink:0"></div>` : ''}
        <div style="flex:1"><div style="font-size:12px;font-weight:800">${esc(r.master_name)}</div><div style="font-size:10px;color:var(--text-muted)">⭐ ${Number(r.master_rating) || 5} • ${esc(r.master_price)} ₽</div></div>
      </div>`
    ).join('');
    responsesBlock = `<div style="margin:10px 0"><div style="font-size:12px;color:#92400E;margin-bottom:6px;font-weight:800">👥 Отклики мастеров (${order.responses.length}):</div>${list}</div>`;
  }
  document.getElementById('orderDetailsContent').innerHTML = `
    ${masterBlock}
    <p style="margin:4px 0"><b>Услуга:</b> ${esc(order.service)}</p>
    <p style="margin:4px 0"><b>Цена:</b> ${esc(order.price)} ₽</p>
    <p style="margin:4px 0"><b>Адрес:</b> ${esc(order.address)}</p>
    <p style="margin:4px 0"><b>Статус:</b> ${getStatusText(order.status)}</p>
    ${photosBlock}${responsesBlock}
    <hr style="margin:10px 0;border:none;border-top:1px solid var(--border)">
  `;
  document.getElementById('orderDetailModal').classList.remove('h');
  document.querySelectorAll('#orderDetailsContent .order-photo-thumb-detail').forEach(img => {
    img.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const pi = parseInt(img.dataset.photo, 10);
      if (order.photos && order.photos[pi]) openPhotoViewer(order.photos[pi]);
    });
  });

  const lat = Number(order.lat) || 55.75;
  const lng = Number(order.lng) || 37.61;
  if (!orderMap) {
    orderMap = L.map('orderMap', { zoomControl: true }).setView([lat, lng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(orderMap);
  } else {
    orderMap.setView([lat, lng], 14);
  }
  if (orderMarkerClient) orderMap.removeLayer(orderMarkerClient);
  if (orderMarkerMaster) orderMap.removeLayer(orderMarkerMaster);
  if (order.lat && order.lng) {
    const clientIcon = L.divIcon({
      className: 'custom-icon',
      html: `<div style="width:20px;height:20px;background:#DC2626;border:2px solid #fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.4)"></div>`,
      iconSize: [20, 20], iconAnchor: [10, 10]
    });
    orderMarkerClient = L.marker([lat, lng], { icon: clientIcon }).addTo(orderMap);
    orderMarkerClient.bindPopup("📍 Место заказа");
  }
  if (order.master_lat && order.master_lng) {
    const masterIcon = L.divIcon({
      className: 'custom-icon',
      html: `<div style="width:20px;height:20px;background:#10B981;border:2px solid #fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.4)"></div>`,
      iconSize: [20, 20], iconAnchor: [10, 10]
    });
    orderMarkerMaster = L.marker([order.master_lat, order.master_lng], { icon: masterIcon }).addTo(orderMap);
    orderMarkerMaster.bindPopup("🛠 Мастер");
  }
  setTimeout(() => orderMap.invalidateSize(), 200);
}

/* ================== НАБЛЮДЕНИЕ ЗА СОБЫТИЯМИ ================== */
function watchForNewEvents() {
  const user = safeJSON(localStorage.getItem('pg_user'), null);
  if (!user) return;
  const orders = safeJSON(localStorage.getItem('pg_orders'), []);
  if (user.role === 'client') {
    const myNew = orders.filter(o =>
      o.status === 'new' && (o.user_id === (user.id || 1) || o.name === user.name)
    );
    const totalResponses = myNew.reduce((sum, o) => sum + ((o.responses || []).length), 0);
    if (lastKnownResponsesCount !== null && totalResponses > lastKnownResponsesCount) {
      playBell();
      showToast('🔔 Новый отклик от мастера!', 'info');
      updateResponsesBanner();
    }
    lastKnownResponsesCount = totalResponses;
  }
  if (user.role === 'executor') {
    const available = orders.filter(o =>
      o.status === 'new' && !(o.responses || []).some(r => r.master_name === user.name)
    );
    const currentIds = available.map(o => o.id);
    if (lastKnownAvailableIds.length > 0) {
      const newIds = currentIds.filter(id => !lastKnownAvailableIds.includes(id));
      if (newIds.length > 0) {
        playBell();
        showToast(`🔔 Новый заказ! (${newIds.length})`, 'info');
      }
    }
    lastKnownAvailableIds = currentIds;
  }
}
